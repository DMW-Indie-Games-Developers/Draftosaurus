<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
    <div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="profile-card w-100" style="max-width: 400px;">
            <div class="profile-header mb-3">
                                <div class="avatar-container position-relative d-flex align-items-center justify-content-center">
                                        <img src="img/isotipoOficial.png" alt="Avatar" class="profile-avatar" id="avatar-img">
                                        <input type="file" id="avatar-input" accept="image/*" style="display:none">
                                        <div id="edit-avatar-overlay" class="edit-avatar-overlay d-flex align-items-center justify-content-center">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-pencil" viewBox="0 0 16 16">
                                                    <path d="M12.146.854a.5.5 0 0 1 .708 0l2.292 2.292a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zm.708-.708A1.5 1.5 0 0 0 12.146.146l-10 10a1.5 1.5 0 0 0-.33.5l-2 5a1.5 1.5 0 0 0 1.95 1.95l5-2a1.5 1.5 0 0 0 .5-.33l10-10a1.5 1.5 0 0 0 0-2.121l-2.292-2.292z"/>
                                                </svg>
                                        </div>
                                </div>
                <div>
                    <h2 class="mb-0" id="user-name">User 01</h2>
                    <span class="fs-4" id="user-id">#01</span>
                    <div id="user-info"></div>
                </div>
            </div>
        </div>
        <button class="btn btn-custom mt-4" id="crear-partida-btn">Crear Partida</button>
        <button class="btn btn-custom footer-btn" onclick="window.location.href='index.html'">Volver al inicio</button>
    </div>
    <script src="js/perfil.js"></script>
</body>
</html>
