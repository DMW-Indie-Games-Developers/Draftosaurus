<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Draftosaurus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html"><img src="/img/isotipoOficial.png" alt="isotipoDMW" class="img-fluid" style="height:40px;"></a>
      <h1 class="text-white ms-2 fs-4">Panel de Administración</h1>
      <button class="btn btn-outline-light ms-auto" onclick="logout()">Cerrar sesión</button>
    </div>
  </nav>

  <div class="container py-4">
    <div class="card mb-4 shadow">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Gestión de Usuarios</h5>
        <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#newUserModal">
          Nuevo Usuario
        </button>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-dark table-hover">
            <thead>
              <tr>
                <th>ID</th><th>Nombre</th><th>Email</th><th>Estado</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody id="usersTable">
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card shadow">
      <div class="card-header">
        <h5 class="mb-0">Mensajes de Contacto</h5>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-dark table-hover">
            <thead>
              <tr>
                <th>ID</th><th>Nombre</th><th>Email</th><th>Mensaje</th><th>Fecha</th>
              </tr>
            </thead>
            <tbody id="messagesTable">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="newUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Nuevo Usuario</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="newUserForm">
          <div class="mb-3">
            <label for="newName" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="newName" required>
          </div>
          <div class="mb-3">
            <label for="newEmail" class="form-label">Correo</label>
            <input type="email" class="form-control" id="newEmail" required>
          </div>
          <div class="mb-3">
            <label for="newPassword" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="newPassword" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="saveNewUser">Guardar</button>
      </div>
    </div></div>
  </div>

  <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar Usuario</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editUserForm">
          <input type="hidden" id="editId">
          <div class="mb-3">
            <label for="editName" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="editName" required>
          </div>
          <div class="mb-3">
            <label for="editEmail" class="form-label">Correo</label>
            <input type="email" class="form-control" id="editEmail" required>
          </div>
          <div class="mb-3">
            <label for="editPassword" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="editPassword">
            <small class="text-muted">Dejar vacío para no cambiar</small>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="saveEditUser">Guardar Cambios</button>
      </div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
