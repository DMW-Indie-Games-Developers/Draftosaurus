<div class="container py-4">

  <!-- Gestión de Usuarios -->
  <div class="card mb-4 shadow">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5 class="mb-0">Gestión de Usuarios</h5>
      <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#newUserModal">Nuevo Usuario</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-dark table-hover">
          <thead>
            <tr>
              <th>ID</th><th>Nombre</th><th>Email</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Mensajes de Contacto -->
  <div class="card shadow">
    <div class="card-header"><h5 class="mb-0">Mensajes de Contacto</h5></div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-dark table-hover">
          <thead>
            <tr>
              <th>ID</th><th>Nombre</th><th>Email</th><th>Asunto</th><th>Mensaje</th><th>Fecha</th>
            </tr>
          </thead>
          <tbody id="messagesTable"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Crear Usuario -->
<div class="modal fade" id="newUserModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Crear Nuevo Usuario</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <form id="newUserForm">
        <div class="mb-3">
          <label for="newName" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="newName" required>
        </div>
        <div class="mb-3">
          <label for="newEmail" class="form-label">Correo</label>
          <input type="email" class="form-control" id="newEmail" required>
        </div>
        <div class="mb-3">
          <label for="newPassword" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="newPassword" required>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button type="button" class="btn btn-primary" id="saveNewUser">Guardar</button>
    </div>
  </div></div>
</div>

<!-- Modal Editar Usuario -->
<div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Editar Usuario</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <form id="editUserForm">
        <input type="hidden" id="editId">
        <div class="mb-3">
          <label for="editName" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="editName" required>
        </div>
        <div class="mb-3">
          <label for="editEmail" class="form-label">Correo</label>
          <input type="email" class="form-control" id="editEmail" required>
        </div>
        <div class="mb-3">
          <label for="editPassword" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="editPassword">
          <small class="text-muted">Dejar vacío para no cambiar</small>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button type="button" class="btn btn-primary" id="saveEditUser">Guardar Cambios</button>
    </div>
  </div></div>
</div>
